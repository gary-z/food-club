[package]
name = "food_club_sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "backtest"
path = "src/backtest.rs"

[[bin]]
name = "food_unified"
path = "src/food_unified.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
