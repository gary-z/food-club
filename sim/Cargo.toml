[package]
name = "food_club_sim"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sim"
path = "src/main.rs"

[[bin]]
name = "hypothesis"
path = "src/hypothesis.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
