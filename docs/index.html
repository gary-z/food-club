<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>Food Club Bet Advisor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 20px; margin: 0 auto; font-size: 13px; }
  h1 { color: #e94560; margin-bottom: 4px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .controls label { font-size: 13px; color: #aaa; }
  .controls input { background: #16213e; border: 1px solid #333; color: #fff; padding: 5px 8px; border-radius: 4px; width: 90px; font-size: 13px; }
  button { background: #e94560; color: #fff; border: none; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  button:hover { background: #c73550; }
  .status { margin: 8px 0; font-size: 13px; color: #aaa; }
  .status.error { color: #e94560; }
  /* Main combined table */
  /* width:auto so every column sizes to its content; stretching the table to the
     full page width would only spread the bet columns apart. */
  .main-table { width: auto; border-collapse: collapse; }
  .main-table th { padding: 6px 8px; color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 2px solid #333; text-align: center; white-space: nowrap; }
  .main-table th.left { text-align: left; }
  .main-table td { padding: 4px 8px; text-align: center; border-bottom: 1px solid #1e1e3a; }
  .main-table td.left { text-align: left; }

  /* Arena name cell — rendered vertically to save horizontal space */
  .arena-name { color: #e94560; font-weight: bold; text-align: center !important; vertical-align: middle; padding: 4px 2px; }
  .arena-name span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; letter-spacing: 1px; }
  .main-table th.arena-head { padding: 6px 2px; }

  /* Arena separator */
  .arena-sep td { border-bottom: 2px solid #333; height: 4px; padding: 0; }

  /* Pirate name with colored background */
  .pirate-tag { display: inline-block; padding: 2px 8px; border-radius: 3px; color: #fff; font-weight: 500; min-width: 80px; text-align: center; }
  .pirate-tag.str-high { background: #4caf50; }
  .pirate-tag.str-mid { background: #2196f3; }
  .pirate-tag.str-low { background: #f44336; }

  /* Numeric cells */
  .num { font-family: monospace; }
  .main-table td.prob-cell { font-family: monospace; text-align: right; }

  /* Payout coloring */
  .payout-pos { color: #4caf50; font-family: monospace; }
  .payout-neg { color: #f44336; font-family: monospace; }

  /* Odds change */
  .odds-changed { color: #4caf50; font-weight: bold; }
  .odds-arrow { color: #4caf50; font-size: 10px; }
  .odds-down { color: #f44336; font-weight: bold; }
  .main-table td.edge-cell { text-align: right; }
  .main-table th.odds-head, .main-table td.odds-cell { padding-left: 4px; padding-right: 4px; }
  .main-table td.odds-cell { font-family: monospace; text-align: right; white-space: nowrap; }
  .odds-arrow-down { color: #f44336; font-size: 10px; }

  /* Bet circles */
  .bet-circle { display: inline-block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid #445; background: transparent; }
  .bet-circle.filled { background: #5588cc; border-color: #5588cc; }

  /* Bet summary rows: the overall stat and the NeoFood Club link sit at the left
     edge of the table, while the row label stays in the column beside the bets. */
  .main-table td.row-stat { text-align: left; white-space: nowrap; }
  .main-table td.row-tag { text-align: left; color: #aaa; white-space: nowrap; }
  .sum-stat { font-family: monospace; color: #e0e0e0; }
  .sum-label { display: inline-block; min-width: 38px; color: #aaa; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  .ev-positive { color: #4caf50; }
  .nfc-link { color: #5588cc; font-size: 11px; white-space: nowrap; }
  .make-bet { background: #e94560; color: #fff; padding: 2px 8px; border-radius: 3px; text-decoration: none; font-size: 11px; white-space: nowrap; }
  .make-bet:hover { background: #c73550; }
</style>
</head>
<body>

<h1>Food Club Bet Advisor</h1>

<div class="controls">
  <label>Bet Amount: <input type="number" id="betAmountInput"></label>
  <label>Max Payout: <input type="number" id="maxPayoutInput" value="56"></label>
  <button onclick="loadLatest()">Reload</button>
</div>

<div id="status" class="status"></div>
<div id="mainContent"></div>

<script src="foodclub.js"></script>
<script>
function setStatus(msg, isError) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'status error' : 'status';
}

async function fetchRound(roundNum) {
  const url = `https://cdn.neofood.club/rounds/${roundNum}.json`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Round ${roundNum} not found (${resp.status})`);
  return resp.json();
}

async function loadLatest() {
  setStatus('Finding latest round...');
  try {
    const resp = await fetch('https://cdn.neofood.club/current_round.txt');
    if (!resp.ok) throw new Error(`Failed to fetch current round (${resp.status})`);
    const roundNum = parseInt((await resp.text()).trim());
    const betInput = document.getElementById('betAmountInput');
    if (!betInput.value) betInput.value = defaultBetAmount(roundNum);
    const data = await fetchRound(roundNum);
    processRound(data);
  } catch (e) {
    setStatus(e.message, true);
  }
}

function defaultBetAmount(roundNum) {
  // Round 9864 has a max bet of 16570; max bet increases by 2 each round.
  return 16570 + 2 * (roundNum - 9864) - 2;
}

function processRound(roundData) {
  const arenas = parseRound(roundData);
  const probs = computeAllProbs(arenas);

  const maxPayoutRatio = parseInt(document.getElementById('maxPayoutInput').value) || 56;

  const bets = generateBets(arenas, probs, {
    maxBets: 10,
    maxPayoutRatio,
    min2sProb: 0.55,
    minJump: 1,
  });

  setStatus('');

  renderMain(arenas, probs, bets, maxPayoutRatio, roundData);
}

function pirateStrClass(pirateId) {
  const str = PIRATES[pirateId - 1].strength;
  if (str >= 80) return 'str-high';
  if (str >= 70) return 'str-mid';
  return 'str-low';
}

function shortName(pirateId) {
  const name = PIRATES[pirateId - 1].name;
  // Use first name or short form
  const parts = name.split(' ');
  if (parts[0] === 'The') return parts[1];
  if (parts[0] === 'Sir' || parts[0] === 'Captain' || parts[0] === 'Admiral') return parts[1];
  if (parts[0] === "Ol'") return "Stripey";
  return parts[0];
}

function makeNeoFoodClubUrl(roundNum, bets) {
  // Encode bets as neofood.club format: 25 chars, each char a-y
  // Each char encodes a pair of arena values (v1*5 + v2) where 0=none, 1-4=pirate (1-indexed)
  // Values are: bet1_arena1, bet1_arena2, ..., bet1_arena5, bet2_arena1, ...
  const vals = [];
  for (let b = 0; b < 10; b++) {
    for (let a = 0; a < 5; a++) {
      if (b < bets.length) {
        const sel = bets[b].selections.find(s => s.arena === a);
        vals.push(sel ? sel.pirateIdx + 1 : 0);
      } else {
        vals.push(0);
      }
    }
  }
  let betStr = '';
  for (let i = 0; i < 50; i += 2) {
    betStr += String.fromCharCode(97 + vals[i] * 5 + vals[i + 1]);
  }
  return `https://neofood.club/#round=${roundNum}&b=${betStr}`;
}

function makeBetUrl(bet, arenas, maxBet) {
  const params = [];
  for (let a = 0; a < 5; a++) {
    const sel = bet.selections.find(s => s.arena === a);
    if (sel) {
      params.push(`winner${a + 1}=${sel.pirateId}`);
      params.push(`matches[]=${a + 1}`);
    }
  }
  params.push(`bet_amount=${maxBet}`);
  params.push(`total_odds=${bet.payout}`);
  params.push(`winnings=${Math.min(bet.payout * maxBet, 1000000)}`);
  params.push(`type=bet`);
  return `https://www.neopets.com/pirates/process_foodclub.phtml?${params.join('&')}`;
}

// Bust probability: P(no bet wins), over all 4^5 = 1024 arena outcomes
function computeBustProb(probs, bets) {
  let bustProb = 0;
  for (let o = 0; o < 1024; o++) {
    // Decode outcome: which pirate wins each arena (0-3)
    const winners = [o & 3, (o >> 2) & 3, (o >> 4) & 3, (o >> 6) & 3, (o >> 8) & 3];
    let outcomeProb = 1;
    for (let a = 0; a < 5; a++) outcomeProb *= probs[a][winners[a]];
    if (outcomeProb < 1e-15) continue;

    // Check if any bet wins this outcome
    let anyBetWins = false;
    for (const bet of bets) {
      let betWins = true;
      for (const s of bet.selections) {
        if (winners[s.arena] !== s.pirateIdx) { betWins = false; break; }
      }
      if (betWins) { anyBetWins = true; break; }
    }
    if (!anyBetWins) bustProb += outcomeProb;
  }
  return bustProb;
}

function renderMain(arenas, probs, bets, maxPayoutRatio, roundData) {
  const numBets = bets.length;
  const bustProb = computeBustProb(probs, bets);

  // Build bet selection lookup: betSelections[betIdx][arenaIdx] = pirateIdx or -1
  const betSelections = bets.map(bet => {
    const sel = new Array(5).fill(-1);
    for (const s of bet.selections) sel[s.arena] = s.pirateIdx;
    return sel;
  });

  let html = '<table class="main-table"><thead><tr>';
  html += '<th class="arena-head"></th>';
  html += '<th class="left">Pirate</th>';
  html += '<th>Prob</th>';
  html += '<th>Edge</th>';
  html += '<th>Fav</th>';
  html += '<th>Allr</th>';
  html += '<th class="odds-head">Open</th>';
  html += '<th class="odds-head">Curr</th>';
  for (let b = 0; b < numBets; b++) {
    html += `<th>Bet ${b + 1}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (let a = 0; a < 5; a++) {
    const arenaNames = ["Shipwreck", "Lagoon", "Treasure", "Hidden", "Harpoon"];

    for (let p = 0; p < 4; p++) {
      const pid = arenas[a].pirateIds[p];
      const pirate = PIRATES[pid - 1];
      const prob = probs[a][p];
      const openOdds = arenas[a].openingOdds[p];
      const curOdds = arenas[a].currentOdds[p];

      const cc = courseCounts(pid, arenas[a].foodIds);

      html += '<tr>';

      // Arena name (rowspan on first pirate)
      if (p === 0) {
        html += `<td class="arena-name" rowspan="4"><span>${arenaNames[a]}</span></td>`;
      }

      // Pirate name tag
      const strCls = pirateStrClass(pid);
      html += `<td class="left"><span class="pirate-tag ${strCls}">${shortName(pid)}</span></td>`;

      // Probability
      html += `<td class="prob-cell">${(prob * 100).toFixed(1)}%</td>`;

      // Edge column
      if (openOdds === 2) {
        const edge = prob * curOdds - 1;
        const edgeCls = edge >= 0 ? 'payout-pos' : 'payout-neg';
        html += `<td class="edge-cell ${edgeCls}">${edge >= 0 ? '+' : ''}${(edge * 100).toFixed(0)}%</td>`;
      } else if (curOdds > openOdds) {
        const minEdge = curOdds / (openOdds + 1) - 1;
        if (minEdge > 0) {
          html += `<td class="edge-cell payout-pos">+${(minEdge * 100).toFixed(0)}%</td>`;
        } else {
          html += `<td class="edge-cell num" style="color:#555">—</td>`;
        }
      } else {
        html += `<td class="edge-cell num" style="color:#555">—</td>`;
      }

      // Fav and Allergy counts
      html += `<td class="num">${cc.nf || ''}</td>`;
      html += `<td class="num">${cc.na || ''}</td>`;

      // Opening odds
      html += `<td class="odds-cell">${openOdds}:1</td>`;

      // Current odds
      if (curOdds > openOdds) {
        html += `<td class="odds-cell"><span class="odds-arrow">\u25B2</span><span class="odds-changed">${curOdds}:1</span></td>`;
      } else if (curOdds < openOdds) {
        html += `<td class="odds-cell"><span class="odds-arrow-down">\u25BC</span><span class="odds-down">${curOdds}:1</span></td>`;
      } else {
        html += `<td class="odds-cell">${curOdds}:1</td>`;
      }

      // Bet circles
      for (let b = 0; b < numBets; b++) {
        const selected = betSelections[b][a] === p;
        html += `<td><span class="bet-circle${selected ? ' filled' : ''}"></span></td>`;
      }

      html += '</tr>';
    }

    // Arena separator
    if (a < 4) {
      html += `<tr class="arena-sep"><td colspan="${8 + numBets}"></td></tr>`;
    }
  }

  // Bet summary rows
  html += `<tr class="arena-sep"><td colspan="${8 + numBets}"></td></tr>`;

  // Each summary row leads with an overall stat at the table's left edge, then
  // the row's label in the column immediately before the bet columns.
  const sumStat = (name, value, cls) =>
    `<span class="sum-stat ${cls || ''}"><span class="sum-label">${name}</span>${value}</span>`;
  const rowLead = (stat, label) =>
    `<td colspan="7" class="row-stat">${stat}</td><td class="row-tag">${label}</td>`;

  // Odds row
  html += '<tr>' + rowLead('', 'Odds');
  for (let b = 0; b < numBets; b++) {
    html += `<td class="num">${bets[b].payout}:1</td>`;
  }
  html += '</tr>';

  // Prob row, with the overall bust chance to the left of the label
  html += '<tr>' + rowLead(sumStat('bust', `${(bustProb * 100).toFixed(1)}%`), 'Prob.');
  for (let b = 0; b < numBets; b++) {
    html += `<td class="num">${(bets[b].winProb * 100).toFixed(1)}%</td>`;
  }
  html += '</tr>';

  // Expected row, with the total to the left of the label
  const totalNet = bets.reduce((sum, bet) => sum + (bet.ev - 1), 0);
  const totalStat = sumStat('total', `${totalNet >= 0 ? '+' : ''}${totalNet.toFixed(2)}`, totalNet >= 0 ? 'ev-positive' : '');
  html += '<tr>' + rowLead(totalStat, 'Expected');
  for (let b = 0; b < numBets; b++) {
    const net = bets[b].ev - 1;
    const cls = net >= 0 ? 'ev-positive' : '';
    html += `<td class="num ${cls}">${net >= 0 ? '+' : ''}${net.toFixed(2)}</td>`;
  }
  html += '</tr>';

  // Make Bet row, with the NeoFood Club link to the left of the buttons
  const maxBet = parseInt(document.getElementById('betAmountInput').value) || defaultBetAmount(roundData.round);
  const nfcUrl = makeNeoFoodClubUrl(roundData.round, bets);
  html += '<tr>' + rowLead(`<a class="nfc-link" href="${nfcUrl}" target="_blank">NeoFood Club</a>`, '');
  for (let b = 0; b < numBets; b++) {
    const url = makeBetUrl(bets[b], arenas, maxBet);
    html += `<td><a class="make-bet" href="${url}" target="_blank">Bet</a></td>`;
  }
  html += '</tr>';

  html += '</tbody></table>';

  document.getElementById('mainContent').innerHTML = html;
}

window.addEventListener('load', () => {
  getRollTable();
  loadLatest();
});
</script>
</body>
</html>
